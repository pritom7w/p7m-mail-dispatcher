name: Debug & Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: DIAGNOSTIC - Inspect Repository File Structure
      run: |
        echo "=== CHECKING ROOT FOLDER ==="
        ls -la
        echo "=== CHECKING APP FOLDER ==="
        ls -la app/ || echo "WARNING: 'app' folder not found!"
        echo "=== CHECKING MANIFEST & SRC ==="
        ls -la app/src/main/ || echo "WARNING: 'app/src/main' folder not found!"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android 34 Platform & Build Tools
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

    - name: Install Gradle
      run: |
        sudo apt-get update
        sudo apt-get install -y gradle

    - name: Generate Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.5

    - name: Build Debug APK with Full Error Trace
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace --info
