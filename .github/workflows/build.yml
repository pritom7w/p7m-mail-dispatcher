name: Build Android APK with Auto-Debug

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Unzip & System Gradle
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip gradle

    - name: Detect, Unzip, and Organize Project Files
      run: |
        python3 -c "
        import zipfile, glob, os, shutil
        print('=== FILES BEFORE UNZIP ===')
        print(os.listdir('.'))
        
        zips = [f for f in os.listdir('.') if f.endswith('.zip')]
        if zips:
            zip_name = zips[0]
            print(f'Found target ZIP: {zip_name}')
            with zipfile.ZipFile(zip_name, 'r') as z:
                z.extractall('extracted_temp')
            os.remove(zip_name)
            
            for item in os.listdir('extracted_temp'):
                if item == '.github':
                    continue
                src = os.path.join('extracted_temp', item)
                dst = os.path.join('.', item)
                if os.path.exists(dst):
                    if os.path.isdir(dst): shutil.rmtree(dst)
                    else: os.remove(dst)
                shutil.move(src, dst)
            shutil.rmtree('extracted_temp')
            print('Successfully extracted and organized ZIP contents.')
        else:
            print('WARNING: No .zip file found in root!')
        
        print('=== FILES AFTER UNZIP ===')
        print(os.listdir('.'))
        "

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Android SDK & Unify Environment Variables
      run: |
        echo "Setting up unified Android SDK..."
        mkdir -p $HOME/android-sdk/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools
        mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
        
        # Unify both ANDROID_HOME and ANDROID_SDK_ROOT to prevent path conflict errors
        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
        echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
        
        export ANDROID_HOME=$HOME/android-sdk
        export ANDROID_SDK_ROOT=$HOME/android-sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        
        yes | sdkmanager --licenses || true
        sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

    - name: Generate Gradle 8.7 Wrapper & Build APK
      run: |
        set -o pipefail
        export ANDROID_HOME=$HOME/android-sdk
        export ANDROID_SDK_ROOT=$HOME/android-sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        
        gradle wrapper --gradle-version 8.7
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace 2>&1 | tee build_output.log

    - name: Upload Success APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Failure Log Artifact
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: Failed-Log
        path: build_output.log
