name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Unzip & Organize with Python
      run: |
        python3 -c "
        import zipfile, glob, os, shutil
        zips = glob.glob('*.zip')
        if zips:
            zip_name = zips[0]
            print(f'Found zip: {zip_name}')
            with zipfile.ZipFile(zip_name, 'r') as z:
                z.extractall('extracted_temp')
            os.remove(zip_name)
            
            temp_contents = os.listdir('extracted_temp')
            if len(temp_contents) == 1 and os.path.isdir(os.path.join('extracted_temp', temp_contents[0])):
                inner_dir = os.path.join('extracted_temp', temp_contents[0])
                for item in os.listdir(inner_dir):
                    shutil.move(os.path.join(inner_dir, item), '.')
            else:
                for item in temp_contents:
                    shutil.move(os.path.join('extracted_temp', item), '.')
            shutil.rmtree('extracted_temp')
            print('Project unzipped and organized successfully!')
        else:
            print('No zip file found in root.')
        "
        ls -la

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Build Tools & Accept Licenses
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

    - name: Build Debug APK with Gradle
      run: |
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
